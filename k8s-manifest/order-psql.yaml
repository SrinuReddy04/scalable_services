apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  labels:
    app: order-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "orders_db"
        - name: POSTGRES_USER
          value: "order_user"
        - name: POSTGRES_PASSWORD
          value: "order_pass"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
spec:
  selector:
    app: order-db
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP